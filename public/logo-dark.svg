<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="100%" height="100%">
  <defs>
    <linearGradient id="tcGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="goldAccentDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- LOGO EMBLEM / ICON -->
  <g transform="translate(10, 8)">
    <circle cx="32" cy="32" r="30" fill="none" stroke="url(#tcGradDark)" stroke-width="2" stroke-dasharray="140 10 20 10" />
    <rect x="6" y="6" width="52" height="52" rx="14" fill="url(#tcGradDark)" />
    <path d="M18 32 C18 22 46 22 46 32 C46 42 18 42 18 32 Z" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="32" cy="32" r="6" fill="#ffffff" />
    <circle cx="32" cy="32" r="2.5" fill="#b91c1c" />
    <circle cx="50" cy="14" r="4.5" fill="url(#goldAccentDark)" stroke="#ffffff" stroke-width="1.5" />
  </g>

  <!-- BRAND NAME "TOÀN CẢNH" (White for dark background) -->
  <g transform="translate(86, 42)">
    <text font-family="'Be Vietnam Pro', 'Montserrat', -apple-system, sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="-0.03em">
      TOÀN CẢNH
    </text>
  </g>

  <!-- BADGE "24H" -->
  <g transform="translate(295, 17)">
    <rect x="0" y="0" width="76" height="32" rx="8" fill="url(#tcGradDark)" />
    <text x="38" y="22" font-family="'Be Vietnam Pro', -apple-system, sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="0.02em">
      24H
    </text>
    <circle cx="68" cy="8" r="3" fill="#22c55e" />
  </g>

  <!-- SUBTITLE / SLOGAN -->
  <g transform="translate(88, 62)">
    <text font-family="'Be Vietnam Pro', -apple-system, sans-serif" font-weight="700" font-size="9" fill="#ef4444" letter-spacing="0.18em">
      BÁO ĐIỆN TỬ TIN TỨC &amp; PHÂN TÍCH ĐA CHIỀU
    </text>
  </g>
</svg>
