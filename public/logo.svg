<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="100%" height="100%">
  <defs>
    <linearGradient id="tcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#990000" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- LOGO EMBLEM / ICON (Aperture / Panoramic Globe / 24h orbit) -->
  <g transform="translate(10, 8)" filter="url(#shadow)">
    <!-- Outer Orbit Ring -->
    <circle cx="32" cy="32" r="30" fill="none" stroke="url(#tcGrad)" stroke-width="2.5" stroke-dasharray="140 10 20 10" />
    <!-- Gradient Background Shield -->
    <rect x="6" y="6" width="52" height="52" rx="14" fill="url(#tcGrad)" />
    <!-- Inner Lens / Panorama Eye Arc -->
    <path d="M18 32 C18 22 46 22 46 32 C46 42 18 42 18 32 Z" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
    <!-- Central Pupil / Globe Core -->
    <circle cx="32" cy="32" r="6" fill="#ffffff" />
    <circle cx="32" cy="32" r="2.5" fill="#990000" />
    <!-- 24h Light Pulse Dot (Top Right) -->
    <circle cx="50" cy="14" r="4.5" fill="url(#goldAccent)" stroke="#ffffff" stroke-width="1.5" />
  </g>

  <!-- BRAND NAME "TOÀN CẢNH" -->
  <g transform="translate(86, 42)">
    <text font-family="'Be Vietnam Pro', 'Montserrat', -apple-system, sans-serif" font-weight="900" font-size="28" fill="#111827" letter-spacing="-0.03em">
      TOÀN CẢNH
    </text>
  </g>

  <!-- BADGE "24H" -->
  <g transform="translate(295, 17)">
    <rect x="0" y="0" width="76" height="32" rx="8" fill="url(#tcGrad)" />
    <text x="38" y="22" font-family="'Be Vietnam Pro', -apple-system, sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="0.02em">
      24H
    </text>
    <!-- Live dot -->
    <circle cx="68" cy="8" r="3" fill="#22c55e" />
  </g>

  <!-- SUBTITLE / SLOGAN -->
  <g transform="translate(88, 62)">
    <text font-family="'Be Vietnam Pro', -apple-system, sans-serif" font-weight="700" font-size="9" fill="#990000" letter-spacing="0.18em">
      BÁO ĐIỆN TỬ TIN TỨC &amp; PHÂN TÍCH ĐA CHIỀU
    </text>
  </g>
</svg>
