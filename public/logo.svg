<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="100%" height="100%">
  <defs>
    <linearGradient id="nsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="goldDot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- ICON EMBLEM -->
  <g transform="translate(10, 8)" filter="url(#shadow)">
    <rect x="6" y="6" width="52" height="52" rx="14" fill="url(#nsGrad)" />
    <!-- Heartbeat Pulse Wave -->
    <polyline points="47 32 39 32 33 46 25 18 19 32 11 32" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Live Beacon Dot -->
    <circle cx="50" cy="14" r="4.5" fill="url(#goldDot)" stroke="#ffffff" stroke-width="1.5" />
  </g>

  <!-- BRAND NAME "NHỊP SỐNG" -->
  <g transform="translate(86, 43)">
    <text font-family="'Be Vietnam Pro', -apple-system, sans-serif" font-weight="900" font-size="28" fill="#111827" letter-spacing="-0.03em">
      NHỊP SỐNG
    </text>
  </g>

  <!-- BADGE "247" -->
  <g transform="translate(285, 18)">
    <rect x="0" y="0" width="76" height="32" rx="8" fill="url(#nsGrad)" />
    <text x="38" y="22" font-family="'Be Vietnam Pro', -apple-system, sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle" letter-spacing="0.02em">
      247
    </text>
    <circle cx="68" cy="8" r="3" fill="#22c55e" />
  </g>

  <!-- SLOGAN -->
  <g transform="translate(88, 63)">
    <text font-family="'Be Vietnam Pro', -apple-system, sans-serif" font-weight="700" font-size="9.5" fill="#dc2626" letter-spacing="0.18em">
      BÁO ĐIỆN TỬ TIN TỨC &amp; NHỊP ĐẬP 24/7
    </text>
  </g>
</svg>
